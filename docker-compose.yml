name: lumix

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    ports:
      # 本機測試可連線；正式部署請移除此 port mapping，僅保留內部 network。
      - "127.0.0.1:${LUMIX_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [lumix-internal]

  redis:
    image: redis:7.4.2-alpine
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"
        fi
        exec redis-server --appendonly yes
    healthcheck:
      test: ["CMD-SHELL", "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping; else redis-cli ping; fi | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${LUMIX_REDIS_PASSWORD:-}
    ports:
      # Redis 只應給 application network 使用；此 mapping 僅便於本機診斷。
      - "127.0.0.1:${LUMIX_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks: [lumix-internal]

  kafka:
    image: apache/kafka:4.3.1
    environment:
      # 單節點 KRaft 僅供本機事件整合開發；正式 Kafka 必須由受治理的叢集與 ACL/TLS 提供。
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server 127.0.0.1:9092 --list >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    ports:
      # 僅限本機 application 連線；不可將未設 ACL/TLS 的開發 broker 對外公開。
      - "127.0.0.1:${LUMIX_KAFKA_PORT:-9092}:9092"
    networks: [lumix-internal]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ELASTIC_STACK_VERSION:-9.5.7}
    profiles: [observability]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: ${LUMIX_ELASTICSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    ports:
      # 本機除錯入口；正式環境不得停用 Elastic security 或直接公開此 port。
      - "127.0.0.1:${LUMIX_ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks: [lumix-internal]

  logstash:
    image: docker.elastic.co/logstash/logstash:${ELASTIC_STACK_VERSION:-9.5.7}
    profiles: [observability]
    environment:
      LS_JAVA_OPTS: ${LUMIX_LOGSTASH_JAVA_OPTS:--Xms256m -Xmx256m}
      XPACK_MONITORING_ENABLED: "false"
    volumes:
      - ./devops/observability/logstash/pipeline:/usr/share/logstash/pipeline:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks: [lumix-internal]

  filebeat:
    image: docker.elastic.co/beats/filebeat:${ELASTIC_STACK_VERSION:-9.5.7}
    profiles: [observability]
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./devops/observability/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ./runtime/logs:/var/log/lumix:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      - logstash
    networks: [lumix-internal]

  kibana:
    image: docker.elastic.co/kibana/kibana:${ELASTIC_STACK_VERSION:-9.5.7}
    profiles: [observability]
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      SERVER_HOST: 0.0.0.0
      TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:${LUMIX_KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks: [lumix-internal]

networks:
  lumix-internal:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  elasticsearch-data:
  filebeat-data:
