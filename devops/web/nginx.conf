server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 靜態前端也不應被嵌入或 MIME sniff；HSTS 僅能由正式 HTTPS ingress 設定，不能在本機 HTTP 偽裝。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # 前台入口不得代理管理 API；高權限請求只能從 admin-web origin 進入。
    location ^~ /api/admin/ {
        return 404;
    }

    # browser 只看見同源 /api，避免在前端內寫死 server host 或放寬 CORS。
    location /api/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # 前台入口不得承載管理路由；管理端只能由獨立 admin-web service 發佈。
    location ^~ /admin/ {
        return 404;
    }

    # 精確 `/admin` 也必須拒絕，否則會被下方 SPA fallback 回傳前台 HTML。
    location = /admin {
        return 404;
    }

    # React Router 的 client-side route 必須回到 index.html，不能由 Nginx 當成遺失的靜態檔。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
