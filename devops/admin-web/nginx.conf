server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 管理端套用與前台相同的基本 browser 防護；TLS 仍由受控 ingress 終結。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # 管理端只代理 `/api/admin`；前台 auth API 不可由這個 origin 呼叫。
    location ^~ /api/admin/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /api/ {
        return 404;
    }

    location = / {
        return 302 /admin/login;
    }

    location = /admin {
        return 302 /admin/login;
    }

    # Vite 的 hashed module 必須可直接載入；其他非 admin page 一律不作 SPA fallback。
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # `try_files` fallback 重新選擇 location 時必須仍能讀取 HTML entry，不能落入下方的全域 404。
    location = /index.html {
        try_files $uri =404;
    }

    location ^~ /admin/ {
        try_files $uri $uri/ /index.html;
    }

    location / {
        return 404;
    }
}
