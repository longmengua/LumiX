input {
  beats {
    port => 5044
  }
}

filter {
  if [error][type] == "json" {
    mutate { add_tag => ["lumix_json_parse_failure"] }
  }
  mutate {
    add_field => { "[@metadata][target_index]" => "lumix-logs" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    ilm_enabled => true
    ilm_rollover_alias => "lumix-logs"
    ilm_pattern => "{now/d}-000001"
    ilm_policy => "lumix-logs-policy"
    manage_template => false
  }
}
